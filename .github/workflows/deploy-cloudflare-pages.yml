name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Check gofmt
        run: |
          fmt_out="$(find . -type f -name '*.go' -not -path './.git/*' -print0 | xargs -0r gofmt -l)"
          if [ -n "$fmt_out" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build:static

      - name: Deploy to Cloudflare Pages
        run: >-
          bunx wrangler pages deploy out
          --project-name pixel-portfolio
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "${{ github.event.head_commit.message || 'Manual deployment' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
